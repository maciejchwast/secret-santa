version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: secret_santa
      POSTGRES_USER: secret
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "secret"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    volumes:
      - redisdata:/data

  api:
    build:
      context: ./backend
      dockerfile: dockerfile
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: celeryworker.dockerfile
    env_file:
      - backend/.env
    depends_on:
      - api
      - redis
    volumes:
      - ./backend/app:/worker/app

  frontend:
    image: node:20
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  reverse-proxy:
    image: caddy:2
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - api

volumes:
  pgdata:
  redisdata:
